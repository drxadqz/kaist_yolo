# RTX 3050-friendly KAIST model.
# TACMFusion v2 = Target-Aware Conflict-Modulated Deformable Fusion.
# It keeps the weak-alignment dual-branch pipeline but rewrites the fusion operator
# itself so target prior, target/background conflict decoupling, and modality mode
# all enter the deformable cross-attention stage directly instead of only refining
# its output.

nc: 1
depth_multiple: 0.33
width_multiple: 0.50

anchors:
  - [10,13, 16,30, 33,23]
  - [30,61, 62,45, 59,119]
  - [116,90, 156,198, 373,326]

backbone:
  [[-1, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],

   [-4, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],

   [[4, 14], 1, DeformTACMFusionBlockLocal, [256, 8, 4, 5, 1, 0.2, 0.2, 4, True, 0.50, 0.50]],
   [[6, 16], 1, DeformTACMFusionBlockLocal, [512, 8, 4, 5, 1, 0.2, 0.2, 4, True, 0.375, 0.375]],
   [[9, 19], 1, DeformTACMFusionBlockLocal, [1024, 8, 4, 5, 1, 0.2, 0.2, 4, True, 0.25, 0.25]],
  ]

head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1,21], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1,20], 1, Concat, [1]],
   [-1, 3, C3, [256, False]],

   [-1, 1, Conv, [256, 3, 2]],
   [[-1,27], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],

   [-1, 1, Conv, [512, 3, 2]],
   [[-1,23], 1, Concat, [1]],
   [-1, 3, C3, [1024, False]],

   [[30, 33, 36], 1, Detect, [nc, anchors]],
  ]
