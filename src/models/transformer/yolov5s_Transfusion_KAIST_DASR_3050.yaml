# Historical/internal config for the IA-DASR line.
# Paper-facing alias: yolov5s_Transfusion_KAIST_IA_DASR_3050.yaml.
# DASR = Deformable Alignment with Scene-aware Reliability.
# The backbone keeps the proven DeformCAT-style deformable RGB-T fusion, then
# adds consensus/detail refinement plus a weak-residual daytime reliability
# refiner. Pair this config with --kaist-day-roi-filter for the evaluation-time
# daytime valid-region calibration used in the IA-DASR thesis line.

nc: 1
depth_multiple: 0.33
width_multiple: 0.50

anchors:
  - [10,13, 16,30, 33,23]
  - [30,61, 62,45, 59,119]
  - [116,90, 156,198, 373,326]

backbone:
  [[-1, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],

   [-4, 1, Conv, [64, 6, 2, 2]],
   [-1, 1, Conv, [128, 3, 2]],
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],

   [[4, 14], 1, DeformDASRFusionBlockLocal, [256, 8, 4, 5, 1, 0.2, 0.2, 4, True, 0.50, 0.375]],
   [[6, 16], 1, DeformDASRFusionBlockLocal, [512, 8, 4, 5, 1, 0.2, 0.2, 4, True, 0.375, 0.25]],
   [[9, 19], 1, DeformDASRFusionBlockLocal, [1024, 8, 4, 5, 1, 0.2, 0.2, 4, True, 0.25, 0.125]],
  ]

head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1,21], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1,20], 1, Concat, [1]],
   [-1, 3, C3, [256, False]],

   [-1, 1, Conv, [256, 3, 2]],
   [[-1,27], 1, Concat, [1]],
   [-1, 3, C3, [512, False]],

   [-1, 1, Conv, [512, 3, 2]],
   [[-1,23], 1, Concat, [1]],
   [-1, 3, C3, [1024, False]],

   [[30, 33, 36], 1, Detect, [nc, anchors]],
  ]
