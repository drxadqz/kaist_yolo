[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-dasr"
version = "1.0.0"
description = "Ignore-aware deformable RGB-T fusion for KAIST pedestrian detection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Qizheng Xing" }
]
keywords = [
  "rgbt",
  "multispectral",
  "pedestrian-detection",
  "cross-modal-attention",
  "deformable-attention",
  "pytorch",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["src"]
