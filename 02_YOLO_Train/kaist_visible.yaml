# KAIST数据集 可见光(RGB/Visible)单模态 训练配置
# 适配你已整理的目录结构
path: E:\KAIST_Dataset\kaist_yolo  # 数据集根目录，所有路径基于此目录

# 训练/验证集图片路径（可见光模态）
train: images/visible/train  # 可见光训练集图片路径
val: images/visible/val      # 可见光验证集图片路径
test: images/visible/val     # 测试集和验证集复用，符合KAIST领域通用规范

# 类别定义
names:
  0: person  # 仅保留person类别，和红外模态完全对齐

# 数据集筛选规则（和红外模态完全一致，保证对比实验公平性）
filter_annotations:
  min_height: 55  # 论文规定的reasonable子集最小行人高度
  max_occlusion: 0.5  # 允许部分遮挡，过滤重度遮挡样本